---
- summary: |
    Успешный входа пользователя с существующей учётной записью
  requirement: |
    Сайт должен поддерживать авторизацию пользователей
  prerequisites: |
    Открыта главная страница сайта, пользователь не авторизован, существует заранее зарегистрированная учётная запись
  test-data: |
    Данные существующей учётной записи (email, password)
  steps:
    - Нажать 'Sign in'
    - Ввести email и password
    - Нажать 'Sign in'
  expected-result: |
    Пользователь авторизован, в интерфейсе в углу отображается его аватар, при перезагрузке страницы сайт не выходит из профиля

- summary: |
    Неудачный вход пользователя с неверными данными
  requirement: |
    Сайт должен поддерживать авторизацию пользователей
  prerequisites: |
    Открыта страница входа, пользователь не авторизован
  test-data: |
    Email = nonexistent_user
    Password = badpass
  steps:
    - Ввести email
    - Ввести password
    - Нажать 'Sign in'
  expected-result: |
    Пользователь не авторизован, отображается сообщение об ошибке

- summary: |
    Проверка использования защищённого соединения
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Браузер открыт, пользователь не авторизован
  test-data: |
    Адрес = http://codebattle.hexlet.io/
  steps:
    - Ввести в адресную строку адрес с http
    - Нажать Enter
    - Проверить протокол и значок замка в адресной строке
  expected-result: |
    Сайт перенаправляет на https, соединение защищено, предупреждений браузера о безопасности нет

- summary: |
    Успешная смена языка программирования в процессе игры
  requirement: |
    Игра должна поддерживать возможность программировать на разных языках и менять язык в процессе игры
  prerequisites: |
    Пользователь авторизован, начата игра, в редакторе введён фрагмент кода
  test-data: |
    Начальный язык = JavaScript, новый язык = Python
  steps:
    - Открыть список языков в редакторе
    - Выбрать новый язык
    - Проверить содержимое редактора
  expected-result: |
    Язык редактора изменился (подсветка, шаблон кода), игра продолжается без перезапуска и потери текущего состояния, логика написанного кода сохранена

- summary: |
    Успешное восстановление игровой сессии по ID
  requirement: |
    Сайт должен иметь поддержку восстановления сессии по ID
  prerequisites: |
    Пользователь авторизован, начата игра, в редакторе написан фрагмент кода, известна ссылка на игру с ID
  test-data: |
    Ссылка вида https://codebattle.hexlet.io/games/{id}, предварительно создать пробную игру
  steps:
    - Скопировать ссылку на игру
    - Закрыть вкладку с игрой
    - Открыть новую вкладку и вставляем ссылку
  expected-result: |
    Пользователь возвращается в ту же игру с сохранённым кодом и текущим состоянием

- summary: |
    Проверка отсутствия таймера на победу в игре
  requirement: |
    В игре не должно быть таймера на победу (игра идёт до первого успешного решения)
  prerequisites: |
    Пользователь авторизован, идёт игра с соперником
  test-data: |
    Ожидание 15 минут без решения
  steps:
    - Создать игру
    - Не отправлять решение 15 минут
    - Проверить состояние игры и интерфейс
  expected-result: |
    Обратного отсчёта нет, игра не завершается по времени, она продолжается до первого успешного решения

- summary: |
    Успешное отображение сайта на мобильном устройстве
  requirement: |
    Сайт должен быть удобным на мобильном устройстве
  prerequisites: |
    Сайт открыть на IPhone 16 или в режиме эмуляции мобильного устройства (ширина экрана 375 px)
  test-data: |
    Устройство = iPhone 16 (эмуляция) или эмуляция
  steps:
    - Открыть главную страницу
    - Авторизоваться
    - Открыть страницу игры
    - Проверить меню, кнопки и редактор кода
    - Проверить доступность личного кабинета
  expected-result: |
    Элементы не перекрывают друг друга, нет горизонтальной прокрутки страницы, кнопки доступны для нажатия, текст читаем

- summary: |
    Отправка оповещения о завершении игры
  requirement: |
    Сайт должен иметь систему оповещений пользователей о подключении к игре, завершении игры и других событиях
  prerequisites: |
    Идёт игра двух пользователей
  test-data: |
    Пользователь A отправляет корректное решение
  steps:
    - Пользователь A запускает проверку корректного решения
    - Наблюдаем за экранами пользователей A и B
  expected-result: |
    Оба пользователя получают оповещение о завершении игры и видят её результат (победитель определён)

- summary: |
    Успешная отправки сообщения во внутреннем чате
  requirement: |
    Сайт должен поддерживать внутренний чат для пользователей
  prerequisites: |
    Два авторизованных пользователя находятся в одной игре или в общем чате
  test-data: |
    Сообщение = Hello! Good luck
  steps:
    - Пользователь A вводит сообщение в поле чата
    - Нажать «Отправить»
    - Проверить чат пользователя B
  expected-result: |
    Сообщение отображается в чате у обоих пользователей с именем отправителя, пользователь B получает оповещение о новом сообщении

- summary: |
    Проверка защиты чата от внедрения HTML/скриптов
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Пользователь авторизован, открыт внутренний чат
  test-data: |
    Сообщение = <script>alert('xss')</script>
  steps:
    - Ввести тестовое сообщение в поле чата
    - Нажать «Отправить»
    - Проверить отображение сообщения у обоих пользователей
  expected-result: |
    Скрипт не выполняется, окно alert не появляется, сообщение отображается как обычный текст

- summary: |
    Наличие личного кабинета и журнала сыгранных игр
  requirement: |
    У пользователя должен быть личный кабинет с журналом игр, где можно просматривать историю всех сыгранных матчей
  prerequisites: |
    Пользователь авторизован и сыграл хотя бы одну игру
  test-data: |
    Учётная запись с одной завершённой игрой
  steps:
    - Открыть личный кабинет
    - Перейти в раздел с историей игр
    - Открыть запись о завершённой игре
  expected-result: |
    В журнале отображается завершённая игра (соперник, результат, дата), по записи можно просмотреть подробности матча

- summary: |
    Наличие таблицы рейтинга игроков
  requirement: |
    У сайта должна быть система рейтингов для пользователей
  prerequisites: |
    Открыта страница рейтинга, пользователь авторизован
  test-data: |
    Нет
  steps:
    - Открыть главную страницу с рейтингом
    - Проверить столбцы и порядок игроков в таблице
    - Прокрутить список
  expected-result: |
    Игроки отсортированы по рейтингу по убыванию, для каждого указаны место и значение рейтинга, пагинация или прокрутка работает

- summary: |
    Успешный переход из рейтинга в профиль игрока
  requirement: |
    У пользователя должен быть личный кабинет
  prerequisites: |
    Открыта страница рейтинга
  test-data: |
    Любой игрок из таблицы
  steps:
    - Нажать на имя игрока в таблице рейтинга
  expected-result: |
    Открывается страница профиля игрока с его статистикой и историей игр

- summary: |
    Совместимость сайта с разными браузерами
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
  prerequisites: |
    Установлены последние версии Chrome, Firefox, Safari и Edge на момент 25.11.2026
  test-data: |
    Браузеры: Chrome, Firefox, Safari, Edge
  steps:
    - Открывть сайт в каждом браузере
    - Авторизоваться
    - Начать игру с ботом
    - Проверить рейтинг
    - Проверить личный кабинет
  expected-result: |
    Во всех браузерах интерфейс отображается корректно, редактор, чат и проверка решения работают одинаково, рейтинг и личный кабинет отображаются одинаково

- summary: |
    Успешный выход из аккаунта и режим 'Offline'
  requirement: |
    Сайт должен поддерживать авторизацию пользователей
  prerequisites: |
    Пользователь авторизован
  test-data: |
    Нет
  steps:
    - Открыть боковое меню пользователя
    - Нажать 'Sign out'
    - Зайти на сайт под другим пользователем и проверить статус первого пользователя
  expected-result: |
    Сессия завершена, пользователь возвращается на страницу для неавторизованных, для других игроков статус этого пользователя меняется на 'Offline'
