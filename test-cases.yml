---
- summary: |
    Краткое описание тест-кейса. Пример: Проверка входа пользователя с существующими логином и паролем
  requirement: |
    Тестируемое требование. Например: При верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например: открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу
  
- summary: |
    Успешный входа пользователя с существующей учётной записью
  requirement: |
    Сайт должен поддерживать авторизацию пользователей
  prerequisites: |
    Открыта главная страница сайта, пользователь не авторизован, существует заранее зарегистрированная учётная запись
  test-data: |
    Данные существующей учётной записи (email, password)
  steps:
    - Нажать 'Sign in'
    - Ввести email и password
    - Нажать 'Sign in'
  expected-result: |
    Пользователь авторизован, в интерфейсе в углу отображается его аватар, при перезагрузке страницы сайт не выходит из профиля

- summary: |
    Неудачный вход пользователя с неверными данными
  requirement: |
    Сайт должен поддерживать авторизацию пользователей
  prerequisites: |
    Открыта страница входа, пользователь не авторизован
  test-data: |
    Email = nonexistent_user
    Password = badpass
  steps:
    - Ввести email
    - Ввести password
    - Нажать 'Sign in'
  expected-result: |
    Пользователь не авторизован, отображается сообщение об ошибке

- summary: |
    Проверка использования защищённого соединения
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Браузер открыт, пользователь не авторизован
  test-data: |
    Адрес = http://codebattle.hexlet.io/
  steps:
    - Ввести в адресную строку адрес с http
    - Нажать Enter
    - Проверить протокол и значок замка в адресной строке
  expected-result: |
    Сайт перенаправляет на https, соединение защищено, предупреждений браузера о безопасности нет

- summary: |
    Успешная смена языка программирования в процессе игры
  requirement: |
    Игра должна поддерживать возможность программировать на разных языках и менять язык в процессе игры
  prerequisites: |
    Пользователь авторизован, начата игра, в редакторе введён фрагмент кода
  test-data: |
    Начальный язык = JavaScript, новый язык = Python
  steps:
    - Открыть список языков в редакторе
    - Выбрать новый язык
    - Проверить содержимое редактора
  expected-result: |
    Язык редактора изменился (подсветка, шаблон кода), игра продолжается без перезапуска и потери текущего состояния, логика написанного кода сохранена

- summary: |
    Успешное восстановление игровой сессии по ID
  requirement: |
    Сайт должен иметь поддержку восстановления сессии по ID
  prerequisites: |
    Пользователь авторизован, начата игра, в редакторе написан фрагмент кода, известна ссылка на игру с ID
  test-data: |
    Ссылка вида https://codebattle.hexlet.io/games/{id}, предварительно создать пробную игру
  steps:
    - Скопировать ссылку на игру
    - Закрыть вкладку с игрой
    - Открыть новую вкладку и вставляем ссылку
  expected-result: |
    Пользователь возвращается в ту же игру с сохранённым кодом и текущим состоянием

- summary: |
    Проверка отсутствия таймера на победу в игре
  requirement: |
    В игре не должно быть таймера на победу (игра идёт до первого успешного решения)
  prerequisites: |
    Пользователь авторизован, идёт игра с соперником
  test-data: |
    Ожидание 15 минут без решения
  steps:
    - Создать игру
    - Не отправлять решение 15 минут
    - Проверить состояние игры и интерфейс
  expected-result: |
    Обратного отсчёта нет, игра не завершается по времени, она продолжается до первого успешного решения
