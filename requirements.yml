---
functional:
  - Сайт должен поддерживать авторизацию пользователей
  - Авторизация пользователей на сайте обязательна
  - Сайт должен быть безопасным и защищать данные пользователя
  - Игра должна поддерживать возможность программировать на разных языках и менять язык в процессе игры
  - Сайт должен иметь систему очередей или матчмейкинга пользователей
  - Сайт должен иметь поддержку восстановления сессии по ID 
  - Тест кода должен запускаются только на коде пользователя, не на коде соперника
  - В игре не должно быть таймера на победу (игра идёт до первого успешного решения)
non-functional:
  - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть удобным на мобильном устройстве
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика (например, 1000 одновременных пользователей)
  - Синхронизация кода пользователя и его противника должна происходит постоянно (например, обновление каждую секунду или чаще)
  - Требуется WebSocket или аналог
implicit:
  -
